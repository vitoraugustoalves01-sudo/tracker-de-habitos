<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#f3f2f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Habit Tracker</title>
<style>
  /* Layout específico da página — tudo que não é um componente genérico
     do design system (cores/tipografia/espaçamento vêm de styles.css). */
  html, body { height: 100%; overscroll-behavior: none; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }

  #header { flex-shrink: 0; padding: var(--space-4) var(--space-4) 0; }
  #header .rule { height: 3px; background: var(--color-text); }
  #header .head-row { display: flex; align-items: baseline; justify-content: space-between; padding: 9px 0 8px; }
  #header .brand { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; letter-spacing: .07em; text-transform: uppercase; }
  #header .date { font-size: 11px; font-style: italic; color: var(--color-neutral-700); }
  #header .div { height: 1px; background: var(--color-divider); }
  #tabs { display: flex; gap: var(--space-6); padding-top: 11px; }
  .tab-btn { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; cursor: pointer; background: none; border: none; padding: 0 0 8px; border-bottom: 2px solid transparent; color: var(--color-neutral-600); }
  .tab-btn.active { color: var(--color-accent-700); border-bottom-color: var(--color-accent); }

  #status-row { flex-shrink: 0; padding: var(--space-3) var(--space-4) 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #status-summary { font-size: 11px; color: var(--color-neutral-700); margin-right: 2px; }

  #content { flex: 1; overflow-y: auto; padding: var(--space-4) var(--space-4) calc(var(--space-8) + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  #content::-webkit-scrollbar { display: none; }

  .tab { display: none; }
  .tab.active { display: block; }

  .section { margin-bottom: 28px; }
  .section-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600; margin-bottom: 12px; }

  .body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .exercise-item { margin-bottom: 10px; gap: 10px; }
  .exercise-header { display: flex; gap: 8px; align-items: center; }
  .remove-btn { border: none; background: none; cursor: pointer; color: var(--color-neutral-600); font-size: 20px; line-height: 1; padding: 2px 4px; }
  .exercise-fields { display: flex; gap: 10px; align-items: center; }
  .pace-display { font-size: 12px; color: var(--color-neutral-700); }
  .muscle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .muscle-label { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--color-neutral-800); cursor: pointer; }
  .muscle-label input { accent-color: var(--color-accent); width: 14px; height: 14px; cursor: pointer; }

  .meal-block + .meal-block { margin-top: 16px; }
  .meal-block label { display: block; font-size: 12px; color: var(--color-neutral-700); margin-bottom: 5px; }
  .meal-obs { margin-top: 6px; font-size: 12px; min-height: 30px; }

  .supp-btn { border: none; cursor: pointer; font: inherit; appearance: none; }

  #upload-wrap { position: sticky; bottom: 0; background: var(--color-bg); padding-top: 10px; margin-top: -8px; }
  #upload-msg { text-align: center; font-size: 12px; margin-top: 6px; min-height: 16px; }
  #upload-msg.ok { color: var(--color-accent-700); }
  #upload-msg.err { color: var(--color-accent-2-700); }

  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-bottom: 30px; }
  .metric-val { font-family: var(--font-heading); font-weight: 600; font-size: 30px; color: var(--color-text); }
  .metric-lbl { font-size: 11px; color: var(--color-neutral-700); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

  .day-card-stats { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--color-neutral-800); }
  .empty-state { text-align: center; color: var(--color-neutral-700); font-size: 14px; padding: 40px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="rule"></div>
    <div class="head-row">
      <div class="brand">Habit Tracker</div>
      <div class="date" id="header-date"></div>
    </div>
    <div class="div"></div>
    <div id="tabs">
      <button class="tab-btn active" id="tab-btn-input" onclick="showTab('input',this)">Registro</button>
      <button class="tab-btn" id="tab-btn-history" onclick="showTab('history',this)">Histórico</button>
    </div>
  </div>

  <div id="status-row">
    <span id="status-summary"></span>
    <span id="status-chips" style="display:contents"></span>
  </div>

  <div id="content">

    <!-- TAB: REGISTRO -->
    <div class="tab active" id="tab-input">

      <div class="section">
        <div class="section-title">Corpo</div>
        <div class="body-grid">
          <div class="field"><label>Sono (h)</label><input class="input" type="text" inputmode="decimal" id="inp-sleep" placeholder="7.5"></div>
          <div class="field"><label>Água (L)</label><input class="input" type="text" inputmode="decimal" id="inp-water" placeholder="3.5"></div>
          <div class="field"><label>Peso (kg)</label><input class="input" type="text" inputmode="decimal" id="inp-weight" placeholder="86.0"></div>
          <div class="field"><label>Gordura (%)</label><input class="input" type="text" inputmode="decimal" id="inp-gordura" placeholder="15.0"></div>
        </div>
        <button type="button" class="btn btn-ghost" id="btn-no-weight" onclick="toggleNoWeight()" style="margin-top:8px;font-size:11px;padding:4px 6px">não me pesei hoje</button>
      </div>

      <div class="section">
        <div class="section-title">Exercícios</div>
        <div id="exercise-list"></div>
        <button type="button" class="btn btn-secondary btn-block" onclick="addExercise()">+ Adicionar exercício</button>
        <datalist id="ex-types-list">
          <option value="Corrida"></option>
          <option value="Musculação"></option>
          <option value="Funcional"></option>
          <option value="Yoga"></option>
          <option value="Natação"></option>
          <option value="Ciclismo"></option>
          <option value="Boxe"></option>
        </datalist>
      </div>

      <div class="section">
        <div class="section-title">Alimentação</div>
        <div class="meal-block">
          <label>Café da manhã</label>
          <textarea class="input" id="inp-breakfast" rows="2" placeholder="ex: 3 ovos mexidos, pão francês, Monster Zero"></textarea>
          <input class="input meal-obs" type="text" id="inp-breakfast-obs" placeholder="observação (opcional)...">
        </div>
        <div class="meal-block">
          <label>Almoço</label>
          <textarea class="input" id="inp-lunch" rows="2" placeholder="ex: marmita light, frango, legumes"></textarea>
          <input class="input meal-obs" type="text" id="inp-lunch-obs" placeholder="observação (opcional)...">
        </div>
        <div class="meal-block">
          <label>Pré-treino</label>
          <textarea class="input" id="inp-pretreino" rows="2" placeholder="ex: banana, whey, café"></textarea>
          <input class="input meal-obs" type="text" id="inp-pretreino-obs" placeholder="observação (opcional)...">
        </div>
        <div class="meal-block">
          <label>Jantar</label>
          <textarea class="input" id="inp-dinner" rows="2" placeholder="ex: 150g patinho, brócolis, mandioquinha"></textarea>
          <input class="input meal-obs" type="text" id="inp-dinner-obs" placeholder="observação (opcional)...">
        </div>
        <div class="meal-block">
          <label>Ceia</label>
          <textarea class="input" id="inp-ceia" rows="2" placeholder="ex: iogurte grego, castanhas"></textarea>
          <input class="input meal-obs" type="text" id="inp-ceia-obs" placeholder="observação (opcional)...">
        </div>
      </div>

      <div class="section">
        <div class="section-title">Suplementação</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px" id="supps-chips"></div>
      </div>

      <div class="section">
        <div class="section-title">Observações</div>
        <textarea class="input" id="inp-notes" rows="3" placeholder="qualquer coisa relevante do dia..."></textarea>
      </div>

      <div id="upload-wrap">
        <button type="button" class="btn btn-primary btn-block" id="upload-btn" onclick="uploadDay()">Upload</button>
        <div id="upload-msg"></div>
      </div>

    </div>

    <!-- TAB: HISTÓRICO -->
    <div class="tab" id="tab-history">
      <div class="metrics-grid" id="metrics-grid"></div>
      <div class="section-title">Dias anteriores</div>
      <div id="history-list"></div>
    </div>

  </div>
</div>

<script>
// ── CONFIG ──
// URL do Google Apps Script Web App (doGet/doPost). Não é secreta — é
// colada manualmente aqui depois do deploy manual do apps-script/Code.gs.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxk-0-iyYx8nzHUvIs-1dTjk2wROo9k2t7K6XdrDOTx4xVqwnKxXinUy1R-Ustn2B4K/exec';

// ── ESTADO ──
const SUPPS = ['Whey','Creatina','ZMA','L-carnitina','Beta-alanina','Colágeno','Multivitamínico','Vitamina D3 50.000 UI'];
const MUSCLES = ['Bíceps','Tríceps','Costas','Peito','Abdômen','Perna','Ombro'];
let state = { exercises: [], supps: {} };
const suppChipEls = {};

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  buildSupps();
  updateHeaderDate();
  wireStatusUpdates();
  updateStatusCard();
  loadToday();
});

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function updateHeaderDate() {
  const d = new Date();
  const label = d.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('header-date').textContent = label.charAt(0).toUpperCase() + label.slice(1);
}

// Aceita vírgula ou ponto como separador decimal (comum em teclado numérico
// pt-BR), normaliza para ponto antes de calcular ou enviar.
function normDec(v) {
  return String(v ?? '').trim().replace(',', '.');
}

// ── SUPPS ──
function buildSupps() {
  const c = document.getElementById('supps-chips');
  SUPPS.forEach(s => {
    state.supps[s] = false;
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'tag tag-neutral supp-btn';
    if (s === 'Vitamina D3 50.000 UI') {
      el.innerHTML = `Vitamina D3 50.000 UI<span style="opacity:.65;margin-left:4px">(semanal)</span>`;
    } else {
      el.textContent = s;
    }
    el.onclick = () => {
      state.supps[s] = !state.supps[s];
      el.className = (state.supps[s] ? 'tag tag-accent' : 'tag tag-neutral') + ' supp-btn';
      updateStatusCard();
    };
    suppChipEls[s] = el;
    c.appendChild(el);
  });
}

// ── PACE ──
function calcPace(km, min) {
  const k = parseFloat(km), m = parseInt(min);
  if (!k || !m || k <= 0 || m <= 0) return '';
  const totalSec = Math.round((m * 60) / k);
  const mm = Math.floor(totalSec / 60);
  const ss = String(totalSec % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

// ── TOGGLE MÚSCULO ──
function toggleMuscle(i, muscle, checked) {
  const arr = state.exercises[i].muscles;
  if (checked && !arr.includes(muscle)) arr.push(muscle);
  if (!checked) state.exercises[i].muscles = arr.filter(m => m !== muscle);
}

// ── EXERCISES ──
// Tipo é texto livre (com sugestões via <datalist>) — a detecção de
// "é corrida"/"é musculação" é por substring case-insensitive, não match
// exato, pra aceitar variações de digitação e manter compatibilidade com
// dados antigos salvos com os nomes fixos de antes.
function serializeExercises() {
  return state.exercises.map(e => {
    const type = e.type || '';
    if (/corr/i.test(type)) {
      const pace = calcPace(e.km, e.runMin);
      const parts = [e.runMin ? e.runMin+'min' : '', e.km ? e.km+'km' : '', pace ? 'Pace: '+pace : ''].filter(Boolean);
      return `${type}(${parts.join(' - ')})`;
    }
    if (/muscul/i.test(type)) {
      return e.muscles.length ? `${type} - ${e.muscles.join(', ')}` : type;
    }
    return `${type}(${e.duration}min${e.detail?' - '+e.detail:''})`;
  }).join(' | ');
}
function addExercise() {
  state.exercises.push({ type: '', duration: '', detail: '', km: '', runMin: '', muscles: [] });
  renderExercises();
}
function removeExercise(i) {
  state.exercises.splice(i, 1);
  renderExercises();
}
function renderExercises() {
  const c = document.getElementById('exercise-list');
  c.innerHTML = '';
  state.exercises.forEach((ex, i) => {
    const div = document.createElement('div');
    div.className = 'exercise-item card elev-sm';
    const type = ex.type || '';
    const isRunning = /corr/i.test(type);
    const isMuscle = /muscul/i.test(type);

    let html = `
      <div class="exercise-header">
        <input class="input" type="text" list="ex-types-list" placeholder="tipo de exercício (ex: Corrida, Musculação...)" value="${type}"
          onchange="state.exercises[${i}].type=this.value;renderExercises();" style="flex:1">
        <button class="remove-btn" aria-label="Remover exercício" onclick="removeExercise(${i})">×</button>
      </div>`;

    if (isRunning) {
      const pace = calcPace(ex.km, ex.runMin);
      html += `
        <div class="exercise-fields">
          <input class="input" type="text" inputmode="decimal" placeholder="km" value="${ex.km}"
            onchange="state.exercises[${i}].km=normDec(this.value); const p=calcPace(state.exercises[${i}].km,state.exercises[${i}].runMin); this.closest('.exercise-item').querySelector('.pace-display').textContent=p?'Pace: '+p+'/km':'';"
            style="width:84px">
          <input class="input" type="text" inputmode="decimal" placeholder="min" value="${ex.runMin}"
            onchange="state.exercises[${i}].runMin=normDec(this.value); const p=calcPace(state.exercises[${i}].km,state.exercises[${i}].runMin); this.closest('.exercise-item').querySelector('.pace-display').textContent=p?'Pace: '+p+'/km':'';"
            style="width:84px">
          <span class="pace-display">${pace ? 'Pace: '+pace+'/km' : ''}</span>
        </div>`;
    } else if (isMuscle) {
      const checkboxes = MUSCLES.map(m => `
        <label class="muscle-label">
          <input type="checkbox" value="${m}" ${ex.muscles.includes(m)?'checked':''}
            onchange="toggleMuscle(${i},'${m}',this.checked)">
          ${m}
        </label>`).join('');
      html += `<div class="muscle-grid">${checkboxes}</div>`;
    } else {
      html += `
        <div class="exercise-fields">
          <input class="input" type="text" inputmode="decimal" placeholder="minutos" value="${ex.duration}"
            onchange="state.exercises[${i}].duration=normDec(this.value);" style="width:100px">
          <input class="input" type="text" placeholder="detalhes (opcional)" value="${ex.detail}"
            onchange="state.exercises[${i}].detail=this.value;" style="flex:1">
        </div>`;
    }

    div.innerHTML = html;
    c.appendChild(div);
  });
  updateStatusCard();
}

// ── MEAL VALUE (com observação) ──
function mealVal(mealId, obsId) {
  const meal = document.getElementById(mealId).value.trim();
  const obs  = document.getElementById(obsId).value.trim();
  if (!meal) return '';
  return obs ? `${meal} (${obs})` : meal;
}

// Estado estruturado de todas as refeições, salvo em meals_json a cada
// alteração de qualquer uma delas — permite recarregar meal/obs separados
// sem parsear a string formatada "refeição (observação)" de volta.
function mealsSnapshot() {
  const pick = (mealId, obsId) => ({
    meal: document.getElementById(mealId).value,
    obs: document.getElementById(obsId).value
  });
  return {
    breakfast: pick('inp-breakfast', 'inp-breakfast-obs'),
    lunch: pick('inp-lunch', 'inp-lunch-obs'),
    pretreino: pick('inp-pretreino', 'inp-pretreino-obs'),
    dinner: pick('inp-dinner', 'inp-dinner-obs'),
    ceia: pick('inp-ceia', 'inp-ceia-obs'),
  };
}

// ── NAVIGATION ──
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
  document.getElementById('status-row').style.display = name === 'input' ? 'flex' : 'none';
  if (name === 'history') loadHistory();
}

// ── UPLOAD ──
// Um único botão envia o dia inteiro numa tacada só (upsert por data no
// Apps Script — sobrescreve só as colunas enviadas, que aqui é sempre o
// conjunto inteiro de campos conhecidos). Substitui o salvamento por
// campo de antes: digitar/marcar coisas só atualiza o estado local (pra
// o card de status e a UI reagirem na hora) até o Upload ser clicado.
async function uploadDay() {
  const btn = document.getElementById('upload-btn');
  const msg = document.getElementById('upload-msg');
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  msg.textContent = '';
  msg.className = '';

  const fields = {
    sleep: normDec(document.getElementById('inp-sleep').value),
    water: normDec(document.getElementById('inp-water').value),
    weight: document.getElementById('inp-weight').disabled ? '' : normDec(document.getElementById('inp-weight').value),
    gordura: normDec(document.getElementById('inp-gordura').value),
    exercises: serializeExercises(),
    exercises_json: JSON.stringify(state.exercises),
    breakfast: mealVal('inp-breakfast', 'inp-breakfast-obs'),
    lunch: mealVal('inp-lunch', 'inp-lunch-obs'),
    pretreino: mealVal('inp-pretreino', 'inp-pretreino-obs'),
    dinner: mealVal('inp-dinner', 'inp-dinner-obs'),
    ceia: mealVal('inp-ceia', 'inp-ceia-obs'),
    meals_json: JSON.stringify(mealsSnapshot()),
    supps: Object.keys(state.supps).filter(k => state.supps[k]).join(', '),
    notes: document.getElementById('inp-notes').value,
  };

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      // text/plain evita o preflight CORS (Apps Script não responde OPTIONS);
      // o corpo continua sendo JSON válido, só o header muda.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ date: todayISO(), ...fields })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'falha ao enviar');
    msg.textContent = '✓ Enviado';
    msg.className = 'ok';
  } catch (e) {
    msg.textContent = 'Erro: ' + e.message;
    msg.className = 'err';
  }

  btn.disabled = false;
  btn.textContent = 'Upload';
}

// Mantém o card de status reagindo enquanto o usuário digita, sem
// disparar nenhuma chamada de rede — isso só acontece no Upload.
function wireStatusUpdates() {
  [
    'inp-sleep', 'inp-water', 'inp-weight', 'inp-gordura',
    'inp-breakfast', 'inp-breakfast-obs', 'inp-lunch', 'inp-lunch-obs',
    'inp-pretreino', 'inp-pretreino-obs', 'inp-dinner', 'inp-dinner-obs',
    'inp-ceia', 'inp-ceia-obs', 'inp-notes'
  ].forEach(id => {
    document.getElementById(id).addEventListener('input', updateStatusCard);
  });
}

// ── STATUS DO DIA ──
function updateStatusCard() {
  const val = id => (document.getElementById(id).value || '').trim();
  const weightFilled = document.getElementById('inp-weight').disabled || !!val('inp-weight');
  const alimentacao = ['inp-breakfast','inp-lunch','inp-pretreino','inp-dinner','inp-ceia'].some(id => val(id));
  const items = [
    ['Sono', !!val('inp-sleep')],
    ['Água', !!val('inp-water')],
    ['Peso', weightFilled],
    ['Gordura', !!val('inp-gordura')],
    ['Treino', state.exercises.some(e => e.type && e.type.trim())],
    ['Alimentação', alimentacao],
    ['Suplementos', Object.values(state.supps).some(Boolean)],
    ['Observações', !!val('inp-notes')],
  ];
  const doneCount = items.filter(([, done]) => done).length;
  document.getElementById('status-summary').textContent = `${doneCount}/${items.length} preenchidos hoje`;
  document.getElementById('status-chips').innerHTML = items.map(([label, done]) =>
    `<span class="tag ${done ? 'tag-accent' : 'tag-neutral'}">${label}</span>`
  ).join('');
}

// ── HISTORY ──
function dateLabel(v) {
  if (!v) return '';
  const s = String(v);
  return s.includes('T') ? s.split('T')[0] : s;
}

// ── LOAD DO DIA (persistência entre sessões/dispositivos) ──
// Repopula o formulário com o que já foi salvo hoje, pra abrir de novo
// mais tarde (ou em outro dispositivo) mostrar o que já foi preenchido
// em vez de tudo em branco.
async function loadToday() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    const rows = (data.values || []).slice(1); // pula header
    const today = todayISO();
    const row = rows.find(r => dateLabel(r[0]) === today);
    if (!row) return;

    const setVal = (id, v) => {
      if (v !== undefined && v !== null && v !== '') document.getElementById(id).value = v;
    };
    setVal('inp-sleep', row[1]);
    setVal('inp-water', row[2]);
    // Peso: se a célula vier vazia (linha já existe mas ainda não pesou,
    // ou marcou "não me pesei"), não reativa o toggle automaticamente —
    // deixa o campo em branco e preenchível normalmente, pra evitar
    // presumir "não me pesei" quando na verdade é só "ainda não preencheu".
    setVal('inp-weight', row[3]);
    setVal('inp-gordura', row[17]);
    setVal('inp-notes', row[15]);

    // Suplementos
    const suppsStr = row[12] || '';
    if (suppsStr) {
      suppsStr.split(',').map(s => s.trim()).filter(Boolean).forEach(name => {
        if (Object.prototype.hasOwnProperty.call(state.supps, name)) {
          state.supps[name] = true;
          suppChipEls[name].className = 'tag tag-accent supp-btn';
        }
      });
    }

    // Exercícios — via coluna estruturada (exercises_json), não parseando
    // a string legível de volta.
    const exJson = row[20];
    if (exJson) {
      try {
        state.exercises = JSON.parse(exJson);
        renderExercises();
      } catch (e) { /* JSON inválido/antigo — ignora, mantém form vazio */ }
    }

    // Refeições — idem, via meals_json.
    const mealsJson = row[21];
    if (mealsJson) {
      try {
        const meals = JSON.parse(mealsJson);
        const applyMeal = (mealId, obsId, m) => {
          if (!m) return;
          document.getElementById(mealId).value = m.meal || '';
          document.getElementById(obsId).value = m.obs || '';
        };
        applyMeal('inp-breakfast', 'inp-breakfast-obs', meals.breakfast);
        applyMeal('inp-lunch', 'inp-lunch-obs', meals.lunch);
        applyMeal('inp-pretreino', 'inp-pretreino-obs', meals.pretreino);
        applyMeal('inp-dinner', 'inp-dinner-obs', meals.dinner);
        applyMeal('inp-ceia', 'inp-ceia-obs', meals.ceia);
      } catch (e) { /* JSON inválido/antigo — ignora */ }
    }

    updateStatusCard();
  } catch (e) {
    // Falha de rede/etc — formulário só começa vazio, como antes. Nenhum
    // dado é perdido (o upsert no backend continua correto).
  }
}

async function loadHistory() {
  const list = document.getElementById('history-list');
  const grid = document.getElementById('metrics-grid');
  list.innerHTML = '<div class="empty-state">Carregando...</div>';

  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    // pula header e linhas sem data (célula A vazia — sobra de algum teste
    // ou edição manual na planilha), mais recente primeiro
    const rows = (data.values || []).slice(1).filter(r => dateLabel(r[0])).reverse();

    if (rows.length === 0) {
      grid.innerHTML = '';
      list.innerHTML = '<div class="empty-state">Nenhum registro ainda.</div>';
      return;
    }

    // Métricas
    const nums = (col) => rows.map(r => parseFloat(r[col])).filter(x => !isNaN(x));
    const avg = (arr) => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '—';
    const exCount = rows.filter(r => r[7] && String(r[7]).trim()).length;

    grid.innerHTML = `
      <div><div class="metric-val">${avg(nums(1))}</div><div class="metric-lbl">sono médio (h)</div></div>
      <div><div class="metric-val">${avg(nums(2))}</div><div class="metric-lbl">água média (L)</div></div>
      <div><div class="metric-val">${avg(nums(3))}</div><div class="metric-lbl">peso médio (kg)</div></div>
      <div><div class="metric-val">${exCount}</div><div class="metric-lbl">dias com treino</div></div>`;

    list.innerHTML = '';
    rows.slice(0,30).forEach(r => {
      const div = document.createElement('div');
      div.className = 'card elev-sm';
      div.style.marginBottom = '10px';
      div.innerHTML = `
        <div class="card-title">${dateLabel(r[0])}</div>
        <div class="day-card-stats">
          ${r[1] ? `<span>Sono <strong>${r[1]}h</strong></span>` : ''}
          ${r[2] ? `<span>Água <strong>${r[2]}L</strong></span>` : ''}
          ${r[3] ? `<span>Peso <strong>${r[3]}kg</strong></span>` : ''}
          ${r[17] ? `<span>Gordura <strong>${r[17]}%</strong></span>` : ''}
        </div>
        ${r[7] ? `<div style="font-size:12px;color:var(--color-neutral-700)">${r[7]}</div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${r[12] ? `<span class="tag tag-accent">${String(r[12]).split(',').length} supls</span>` : ''}
        </div>
        ${r[15] ? `<p class="card-body" style="font-style:italic">${r[15]}</p>` : ''}`;
      list.appendChild(div);
    });
  } catch(e) {
    list.innerHTML = `<div class="empty-state">Erro ao carregar: ${e.message}</div>`;
  }
}

// ── TOGGLE PESO ──
function toggleNoWeight() {
  const inp = document.getElementById('inp-weight');
  const btn = document.getElementById('btn-no-weight');
  const noWeight = inp.disabled;
  if (noWeight) {
    inp.disabled = false;
    inp.placeholder = '86.0';
    btn.textContent = 'não me pesei hoje';
  } else {
    inp.disabled = true;
    inp.value = '';
    inp.placeholder = 'não pesado';
    btn.textContent = 'registrar peso';
  }
  updateStatusCard();
}
