<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0ece4;
    --text2: #888;
    --text3: #555;
    --accent: #2563eb;
    --accent-light: rgba(37,99,235,0.15);
    --success: #16a34a;
    --danger: #dc2626;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; overscroll-behavior: none; }

  /* LAYOUT */
  #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }
  #header { padding: 16px 20px 8px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
  #header h1 { font-size: 17px; font-weight: 600; }
  #header .date { font-size: 12px; color: var(--text2); margin-top: 2px; }
  #content { flex: 1; overflow-y: auto; padding: 16px 20px 100px; }
  #bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 0.5px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; font-size: 11px; color: var(--text3); cursor: pointer; gap: 3px; border: none; background: none; }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 22px; height: 22px; }

  /* TABS */
  .tab { display: none; }
  .tab.active { display: block; }

  /* SECTIONS */
  .section { margin-bottom: 20px; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text2); margin-bottom: 8px; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .field { display: flex; align-items: center; padding: 12px 14px; border-bottom: 0.5px solid var(--border); gap: 12px; }
  .field:last-child { border-bottom: none; }
  .field-label { font-size: 13px; color: var(--text2); flex: 0 0 100px; }
  .field input[type=text] {
    flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 15px; text-align: right; width: 100%;
  }
  .field input::placeholder { color: var(--text3); }
  .field textarea { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; resize: none; width: 100%; line-height: 1.5; }

  /* CHIPS */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border2); background: transparent; cursor: pointer; color: var(--text2); transition: all .15s; }
  .chip.on { background: var(--accent-light); border-color: var(--accent); color: var(--text); }
  .badge-weekly { font-size: 9px; color: var(--text3); margin-left: 4px; }

  /* EXERCISE */
  .exercise-item { padding: 12px 14px; border-bottom: 0.5px solid var(--border); }
  .exercise-item:last-child { border-bottom: none; }
  .exercise-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .exercise-type-select { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; padding: 5px 8px; }
  .remove-btn { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 4px; }
  .exercise-fields { display: flex; gap: 8px; align-items: center; }
  .exercise-fields input { flex: 1; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 7px 10px; }
  .add-ex-btn { display: flex; align-items: center; gap: 6px; padding: 12px 14px; font-size: 13px; color: var(--accent); background: none; border: none; cursor: pointer; width: 100%; }
  .muscle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-top: 8px; }
  .muscle-label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); cursor: pointer; }
  .muscle-label input { width: 13px; height: 13px; cursor: pointer; accent-color: var(--accent); }
  .pace-display { font-size: 12px; color: var(--text2); flex: 1; text-align: right; }

  /* TEXTAREA BLOCK */
  .textarea-block { padding: 10px 14px; }
  .textarea-block label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 4px; }
  .textarea-block textarea { width: 100%; background: none; border: none; outline: none; color: var(--text); font-size: 14px; resize: none; line-height: 1.5; }
  .meal-obs { width: 100%; background: none; border: none; outline: none; color: var(--text3); font-size: 12px; padding: 2px 0 4px; display: block; }
  .meal-obs::placeholder { color: var(--text3); }

  /* FIELD SAVE STATUS (badge flutuante, mostrado perto do campo editado) */
  #field-status-badge { position: fixed; font-size: 11px; padding: 4px 9px; border-radius: 20px; background: var(--surface2); border: 0.5px solid var(--border2); color: var(--text2); pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 999; white-space: nowrap; }
  #field-status-badge.show { opacity: 1; }
  #field-status-badge.ok { color: var(--success); border-color: var(--success); }
  #field-status-badge.err { color: var(--danger); border-color: var(--danger); }

  /* HISTORY */
  .day-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .day-card-date { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .day-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .day-stat { font-size: 12px; color: var(--text2); }
  .day-stat span { color: var(--text); font-weight: 500; }
  .badge { display: inline-flex; align-items: center; font-size: 11px; padding: 3px 8px; border-radius: 10px; margin: 2px; }
  .badge-blue { background: var(--accent-light); color: #60a5fa; }
  .badge-green { background: rgba(22,163,74,.15); color: #4ade80; }
  .badges-row { margin-top: 8px; }
  .empty-state { text-align: center; color: var(--text2); font-size: 14px; padding: 40px 0; }

  /* METRICS */
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .metric-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .metric-val { font-size: 26px; font-weight: 600; }
  .metric-lbl { font-size: 11px; color: var(--text2); margin-top: 3px; }

  /* SPINNER */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ANALYSIS */
  .analysis-output { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: var(--text); min-height: 80px; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1 id="header-title">Registro do dia</h1>
    <div class="date" id="header-date"></div>
  </div>

  <div id="content">

    <!-- TAB: REGISTRO -->
    <div class="tab active" id="tab-input">

      <div class="section">
        <div class="section-title">Status de hoje</div>
        <div class="card">
          <div class="chips" id="status-chips"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Corpo</div>
        <div class="card">
          <div class="field"><label class="field-label">Sono (h)</label><input type="text" inputmode="decimal" id="inp-sleep" placeholder="7.5"></div>
          <div class="field"><label class="field-label">Água (L)</label><input type="text" inputmode="decimal" id="inp-water" placeholder="3.5"></div>
          <div class="field"><label class="field-label">Peso (kg)</label><input type="text" inputmode="decimal" id="inp-weight" placeholder="86.0"><button id="btn-no-weight" onclick="toggleNoWeight()" style="background:none;border:0.5px solid var(--border2);border-radius:var(--radius-sm);color:var(--text2);font-size:11px;padding:4px 8px;cursor:pointer;white-space:nowrap;margin-left:4px">não me pesei</button></div>
          <div class="field"><label class="field-label">Gordura (%)</label><input type="text" inputmode="decimal" id="inp-gordura" placeholder="15.0"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Exercícios</div>
        <div class="card">
          <div id="exercise-list"></div>
          <button class="add-ex-btn" onclick="addExercise()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Adicionar exercício
          </button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Alimentação</div>
        <div class="card">
          <div class="textarea-block">
            <label>Café da manhã</label>
            <textarea id="inp-breakfast" rows="2" placeholder="ex: 3 ovos mexidos, pão francês, Monster Zero"></textarea>
            <input type="text" id="inp-breakfast-obs" class="meal-obs" placeholder="observação (opcional)...">
          </div>
          <div style="border-top:0.5px solid var(--border)" class="textarea-block">
            <label>Almoço</label>
            <textarea id="inp-lunch" rows="2" placeholder="ex: marmita light, frango, legumes"></textarea>
            <input type="text" id="inp-lunch-obs" class="meal-obs" placeholder="observação (opcional)...">
          </div>
          <div style="border-top:0.5px solid var(--border)" class="textarea-block">
            <label>Pré-treino</label>
            <textarea id="inp-pretreino" rows="2" placeholder="ex: banana, whey, café"></textarea>
            <input type="text" id="inp-pretreino-obs" class="meal-obs" placeholder="observação (opcional)...">
          </div>
          <div style="border-top:0.5px solid var(--border)" class="textarea-block">
            <label>Jantar</label>
            <textarea id="inp-dinner" rows="2" placeholder="ex: 150g patinho, brócolis, mandioquinha"></textarea>
            <input type="text" id="inp-dinner-obs" class="meal-obs" placeholder="observação (opcional)...">
          </div>
          <div style="border-top:0.5px solid var(--border)" class="textarea-block">
            <label>Ceia</label>
            <textarea id="inp-ceia" rows="2" placeholder="ex: iogurte grego, castanhas"></textarea>
            <input type="text" id="inp-ceia-obs" class="meal-obs" placeholder="observação (opcional)...">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Suplementação</div>
        <div class="card">
          <div class="chips" id="supps-chips"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Observações</div>
        <div class="card">
          <div class="textarea-block"><textarea id="inp-notes" rows="3" placeholder="qualquer coisa relevante do dia..."></textarea></div>
        </div>
      </div>
    </div>

    <!-- TAB: HISTÓRICO -->
    <div class="tab" id="tab-history">
      <div class="metrics-grid" id="metrics-grid"></div>
      <div id="history-list"></div>
    </div>

  </div>

  <nav id="bottom-nav">
    <button class="nav-item active" onclick="showTab('input',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Registro
    </button>
    <button class="nav-item" onclick="showTab('history',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Histórico
    </button>
  </nav>
</div>

<script>
// ── CONFIG ──
// URL do Google Apps Script Web App (doGet/doPost). Não é secreta — é
// colada manualmente aqui depois do deploy manual do apps-script/Code.gs.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxk-0-iyYx8nzHUvIs-1dTjk2wROo9k2t7K6XdrDOTx4xVqwnKxXinUy1R-Ustn2B4K/exec';

// ── ESTADO ──
const SUPPS = ['Whey','Creatina','ZMA','L-carnitina','Beta-alanina','Colágeno','Multivitamínico','Vitamina D3 50.000 UI'];
const EX_TYPES = ['Boxe','Corrida','Musculação','Funcional','Yoga','Outro'];
const MUSCLES = ['Bíceps','Tríceps','Costas','Peito','Abdômen','Perna','Ombro'];
let state = { exercises: [], supps: {} };
const suppChipEls = {};

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  buildSupps();
  updateHeaderDate();
  wireLiveSave();
  updateStatusCard();
  loadToday();
});

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function updateHeaderDate() {
  const d = new Date();
  document.getElementById('header-date').textContent = d.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
}

// Aceita vírgula ou ponto como separador decimal (comum em teclado numérico
// pt-BR), normaliza para ponto antes de calcular ou enviar.
function normDec(v) {
  return String(v ?? '').trim().replace(',', '.');
}

// ── SUPPS ──
function buildSupps() {
  const c = document.getElementById('supps-chips');
  SUPPS.forEach(s => {
    state.supps[s] = false;
    const el = document.createElement('button');
    el.className = 'chip';
    if (s === 'Vitamina D3 50.000 UI') {
      el.innerHTML = `Vitamina D3 50.000 UI<span class="badge-weekly">(semanal)</span>`;
    } else {
      el.textContent = s;
    }
    el.onclick = () => {
      state.supps[s] = !state.supps[s];
      el.classList.toggle('on', state.supps[s]);
      saveNow('supps', { supps: Object.keys(state.supps).filter(k => state.supps[k]).join(', ') }, el);
      updateStatusCard();
    };
    suppChipEls[s] = el;
    c.appendChild(el);
  });
}

// ── PACE ──
function calcPace(km, min) {
  const k = parseFloat(km), m = parseInt(min);
  if (!k || !m || k <= 0 || m <= 0) return '';
  const totalSec = Math.round((m * 60) / k);
  const mm = Math.floor(totalSec / 60);
  const ss = String(totalSec % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

// ── TOGGLE MÚSCULO ──
function toggleMuscle(i, muscle, checked, el) {
  const arr = state.exercises[i].muscles;
  if (checked && !arr.includes(muscle)) arr.push(muscle);
  if (!checked) state.exercises[i].muscles = arr.filter(m => m !== muscle);
  saveExercises(el);
}

// ── EXERCISES ──
function serializeExercises() {
  return state.exercises.map(e => {
    if (e.type === 'Corrida') {
      const pace = calcPace(e.km, e.runMin);
      const parts = [e.runMin ? e.runMin+'min' : '', e.km ? e.km+'km' : '', pace ? 'Pace: '+pace : ''].filter(Boolean);
      return `Corrida(${parts.join(' - ')})`;
    }
    if (e.type === 'Musculação') {
      return e.muscles.length ? `Musculação - ${e.muscles.join(', ')}` : 'Musculação';
    }
    return `${e.type}(${e.duration}min${e.detail?' - '+e.detail:''})`;
  }).join(' | ');
}
// Salva a versão legível (exercises) e a estruturada (exercises_json) juntas
// — a JSON é o que permite reconstruir a UI ao recarregar a página, sem
// precisar parsear a string formatada de volta.
function saveExercises(el) {
  saveNow('exercises', { exercises: serializeExercises(), exercises_json: JSON.stringify(state.exercises) }, el);
}
function addExercise() {
  state.exercises.push({ type: 'Boxe', duration: '', detail: '', km: '', runMin: '', muscles: [] });
  renderExercises();
  saveExercises(document.getElementById('exercise-list'));
}
function removeExercise(i) {
  state.exercises.splice(i, 1);
  renderExercises();
  saveExercises(document.getElementById('exercise-list'));
}
function renderExercises() {
  const c = document.getElementById('exercise-list');
  c.innerHTML = '';
  state.exercises.forEach((ex, i) => {
    const div = document.createElement('div');
    div.className = 'exercise-item';

    let html = `
      <div class="exercise-header">
        <select class="exercise-type-select" onchange="state.exercises[${i}].type=this.value;renderExercises();saveExercises(document.getElementById('exercise-list'));">
          ${EX_TYPES.map(t => `<option${t===ex.type?' selected':''}>${t}</option>`).join('')}
        </select>
        <button class="remove-btn" onclick="removeExercise(${i})">×</button>
      </div>`;

    if (ex.type === 'Corrida') {
      const pace = calcPace(ex.km, ex.runMin);
      html += `
        <div class="exercise-fields">
          <input type="text" inputmode="decimal" placeholder="km" value="${ex.km}"
            onchange="state.exercises[${i}].km=normDec(this.value); const p=calcPace(state.exercises[${i}].km,state.exercises[${i}].runMin); this.closest('.exercise-item').querySelector('.pace-display').textContent=p?'Pace: '+p+'/km':''; saveExercises(this);"
            style="flex:0 0 80px">
          <input type="text" inputmode="decimal" placeholder="min" value="${ex.runMin}"
            onchange="state.exercises[${i}].runMin=normDec(this.value); const p=calcPace(state.exercises[${i}].km,state.exercises[${i}].runMin); this.closest('.exercise-item').querySelector('.pace-display').textContent=p?'Pace: '+p+'/km':''; saveExercises(this);"
            style="flex:0 0 80px">
          <span class="pace-display">${pace ? 'Pace: '+pace+'/km' : ''}</span>
        </div>`;
    } else if (ex.type === 'Musculação') {
      const checkboxes = MUSCLES.map(m => `
        <label class="muscle-label">
          <input type="checkbox" value="${m}" ${ex.muscles.includes(m)?'checked':''}
            onchange="toggleMuscle(${i},'${m}',this.checked,this)">
          ${m}
        </label>`).join('');
      html += `<div class="muscle-grid">${checkboxes}</div>`;
    } else {
      html += `
        <div class="exercise-fields">
          <input type="text" inputmode="decimal" placeholder="minutos" value="${ex.duration}"
            onchange="state.exercises[${i}].duration=normDec(this.value); saveExercises(this);" style="flex:0 0 90px">
          <input type="text" placeholder="detalhes (ex: 6 rounds)" value="${ex.detail}"
            onchange="state.exercises[${i}].detail=this.value; saveExercises(this);">
        </div>`;
    }

    div.innerHTML = html;
    c.appendChild(div);
  });
  updateStatusCard();
}

// ── MEAL VALUE (com observação) ──
function mealVal(mealId, obsId) {
  const meal = document.getElementById(mealId).value.trim();
  const obs  = document.getElementById(obsId).value.trim();
  if (!meal) return '';
  return obs ? `${meal} (${obs})` : meal;
}

// Estado estruturado de todas as refeições, salvo em meals_json a cada
// alteração de qualquer uma delas — permite recarregar meal/obs separados
// sem parsear a string formatada "refeição (observação)" de volta.
function mealsSnapshot() {
  const pick = (mealId, obsId) => ({
    meal: document.getElementById(mealId).value,
    obs: document.getElementById(obsId).value
  });
  return {
    breakfast: pick('inp-breakfast', 'inp-breakfast-obs'),
    lunch: pick('inp-lunch', 'inp-lunch-obs'),
    pretreino: pick('inp-pretreino', 'inp-pretreino-obs'),
    dinner: pick('inp-dinner', 'inp-dinner-obs'),
    ceia: pick('inp-ceia', 'inp-ceia-obs'),
  };
}

// ── NAVIGATION ──
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
  const titles = { input:'Registro do dia', history:'Histórico' };
  document.getElementById('header-title').textContent = titles[name];
  if (name === 'history') loadHistory();
}

// ── SALVAMENTO AO VIVO ──
// Cada campo dispara seu próprio upsert parcial no Apps Script (só o
// campo alterado, nunca o formulário inteiro). Campos de digitação livre
// usam debounce curto; controles de clique (chips/checkbox/select) salvam
// na hora, já que o evento em si já marca "parei de mexer".
const pendingTimers = {};

// timerKey só serve pra coalescer/cancelar debounces concorrentes do mesmo
// campo — os fields de fato enviados vêm inteiros de getFields()/fields
// (pode ser mais de uma coluna por chamada, ex: exercises + exercises_json).
function scheduleSave(timerKey, getFields, el) {
  clearTimeout(pendingTimers[timerKey]);
  pendingTimers[timerKey] = setTimeout(() => doSave(getFields(), el), 800);
}

function saveNow(timerKey, fields, el) {
  clearTimeout(pendingTimers[timerKey]);
  doSave(fields, el);
}

async function doSave(fields, el) {
  showFieldStatus(el, 'saving', 'salvando…');
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      // text/plain evita o preflight CORS (Apps Script não responde OPTIONS);
      // o corpo continua sendo JSON válido, só o header muda.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ date: todayISO(), ...fields })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'falha ao salvar');
    showFieldStatus(el, 'ok', '✓ salvo');
  } catch (e) {
    showFieldStatus(el, 'err', 'erro ao salvar');
  }
  updateStatusCard();
}

function showFieldStatus(el, kind, text) {
  if (!el) return;
  let badge = document.getElementById('field-status-badge');
  if (!badge) {
    badge = document.createElement('div');
    badge.id = 'field-status-badge';
    document.body.appendChild(badge);
  }
  const rect = el.getBoundingClientRect();
  badge.style.top = Math.max(8, rect.top - 26) + 'px';
  badge.style.left = Math.min(window.innerWidth - 90, Math.max(8, rect.right - 80)) + 'px';
  badge.textContent = text;
  badge.className = 'show' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : '');
  clearTimeout(badge._hideTimer);
  if (kind !== 'saving') {
    badge._hideTimer = setTimeout(() => badge.classList.remove('show'), 1400);
  }
}

function wireLiveSave() {
  const decimalKeys = { 'inp-sleep':'sleep', 'inp-water':'water', 'inp-weight':'weight', 'inp-gordura':'gordura' };
  Object.keys(decimalKeys).forEach(id => {
    const el = document.getElementById(id);
    const key = decimalKeys[id];
    el.addEventListener('input', () => {
      scheduleSave(key, () => ({ [key]: normDec(el.value) }), el);
      updateStatusCard();
    });
  });

  const meals = [
    ['breakfast', 'inp-breakfast', 'inp-breakfast-obs'],
    ['lunch', 'inp-lunch', 'inp-lunch-obs'],
    ['pretreino', 'inp-pretreino', 'inp-pretreino-obs'],
    ['dinner', 'inp-dinner', 'inp-dinner-obs'],
    ['ceia', 'inp-ceia', 'inp-ceia-obs'],
  ];
  meals.forEach(([key, mealId, obsId]) => {
    const mealEl = document.getElementById(mealId);
    const obsEl = document.getElementById(obsId);
    const handler = (el) => {
      scheduleSave(key, () => ({ [key]: mealVal(mealId, obsId), meals_json: JSON.stringify(mealsSnapshot()) }), el);
      updateStatusCard();
    };
    mealEl.addEventListener('input', () => handler(mealEl));
    obsEl.addEventListener('input', () => handler(obsEl));
  });

  const notesEl = document.getElementById('inp-notes');
  notesEl.addEventListener('input', () => {
    scheduleSave('notes', () => ({ notes: notesEl.value }), notesEl);
    updateStatusCard();
  });
}

// ── STATUS DO DIA ──
function updateStatusCard() {
  const val = id => (document.getElementById(id).value || '').trim();
  const weightFilled = document.getElementById('inp-weight').disabled || !!val('inp-weight');
  const items = [
    ['Sono', !!val('inp-sleep')],
    ['Água', !!val('inp-water')],
    ['Peso', weightFilled],
    ['Gordura', !!val('inp-gordura')],
    ['Exercício', state.exercises.length > 0],
    ['Café', !!val('inp-breakfast')],
    ['Almoço', !!val('inp-lunch')],
    ['Pré-treino', !!val('inp-pretreino')],
    ['Jantar', !!val('inp-dinner')],
    ['Ceia', !!val('inp-ceia')],
    ['Suplementos', Object.values(state.supps).some(Boolean)],
    ['Notas', !!val('inp-notes')],
  ];
  document.getElementById('status-chips').innerHTML = items.map(([label, done]) =>
    `<span class="chip${done ? ' on' : ''}">${done ? '✓ ' : ''}${label}</span>`
  ).join('');
}

// ── HISTORY ──
function dateLabel(v) {
  if (!v) return '';
  const s = String(v);
  return s.includes('T') ? s.split('T')[0] : s;
}

// ── LOAD DO DIA (persistência entre sessões/dispositivos) ──
// Repopula o formulário com o que já foi salvo hoje, pra abrir de novo
// mais tarde (ou em outro dispositivo) mostrar o que já foi preenchido
// em vez de tudo em branco.
async function loadToday() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    const rows = (data.values || []).slice(1); // pula header
    const today = todayISO();
    const row = rows.find(r => dateLabel(r[0]) === today);
    if (!row) return;

    const setVal = (id, v) => {
      if (v !== undefined && v !== null && v !== '') document.getElementById(id).value = v;
    };
    setVal('inp-sleep', row[1]);
    setVal('inp-water', row[2]);
    // Peso: se a célula vier vazia (linha já existe mas ainda não pesou,
    // ou marcou "não me pesei"), não reativa o toggle automaticamente —
    // deixa o campo em branco e preenchível normalmente, pra evitar
    // presumir "não me pesei" quando na verdade é só "ainda não preencheu".
    setVal('inp-weight', row[3]);
    setVal('inp-gordura', row[17]);
    setVal('inp-notes', row[15]);

    // Suplementos
    const suppsStr = row[12] || '';
    if (suppsStr) {
      suppsStr.split(',').map(s => s.trim()).filter(Boolean).forEach(name => {
        if (Object.prototype.hasOwnProperty.call(state.supps, name)) {
          state.supps[name] = true;
          suppChipEls[name].classList.add('on');
        }
      });
    }

    // Exercícios — via coluna estruturada (exercises_json), não parseando
    // a string legível de volta.
    const exJson = row[20];
    if (exJson) {
      try {
        state.exercises = JSON.parse(exJson);
        renderExercises();
      } catch (e) { /* JSON inválido/antigo — ignora, mantém form vazio */ }
    }

    // Refeições — idem, via meals_json.
    const mealsJson = row[21];
    if (mealsJson) {
      try {
        const meals = JSON.parse(mealsJson);
        const applyMeal = (mealId, obsId, m) => {
          if (!m) return;
          document.getElementById(mealId).value = m.meal || '';
          document.getElementById(obsId).value = m.obs || '';
        };
        applyMeal('inp-breakfast', 'inp-breakfast-obs', meals.breakfast);
        applyMeal('inp-lunch', 'inp-lunch-obs', meals.lunch);
        applyMeal('inp-pretreino', 'inp-pretreino-obs', meals.pretreino);
        applyMeal('inp-dinner', 'inp-dinner-obs', meals.dinner);
        applyMeal('inp-ceia', 'inp-ceia-obs', meals.ceia);
      } catch (e) { /* JSON inválido/antigo — ignora */ }
    }

    updateStatusCard();
  } catch (e) {
    // Falha de rede/etc — formulário só começa vazio, como antes. Nenhum
    // dado é perdido (o upsert no backend continua correto).
  }
}

async function loadHistory() {
  const list = document.getElementById('history-list');
  const grid = document.getElementById('metrics-grid');
  list.innerHTML = '<div class="empty-state">Carregando...</div>';

  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    const rows = (data.values || []).slice(1).reverse(); // pula header, mais recente primeiro

    if (rows.length === 0) {
      grid.innerHTML = '';
      list.innerHTML = '<div class="empty-state">Nenhum registro ainda.</div>';
      return;
    }

    // Métricas
    const nums = (col) => rows.map(r => parseFloat(r[col])).filter(x => !isNaN(x));
    const avg = (arr) => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '-';
    const exCount = rows.filter(r => r[7] && String(r[7]).trim()).length;

    grid.innerHTML = `
      <div class="metric-card"><div class="metric-val">${avg(nums(1))}</div><div class="metric-lbl">sono médio (h)</div></div>
      <div class="metric-card"><div class="metric-val">${avg(nums(2))}</div><div class="metric-lbl">água média (L)</div></div>
      <div class="metric-card"><div class="metric-val">${avg(nums(3))}</div><div class="metric-lbl">peso médio (kg)</div></div>
      <div class="metric-card"><div class="metric-val">${exCount}</div><div class="metric-lbl">dias com treino</div></div>`;

    list.innerHTML = '';
    rows.slice(0,30).forEach(r => {
      const div = document.createElement('div');
      div.className = 'day-card';
      div.innerHTML = `
        <div class="day-card-date">${dateLabel(r[0])}</div>
        <div class="day-card-grid">
          ${r[1] ? `<div class="day-stat">Sono <span>${r[1]}h</span></div>` : ''}
          ${r[2] ? `<div class="day-stat">Água <span>${r[2]}L</span></div>` : ''}
          ${r[3] ? `<div class="day-stat">Peso <span>${r[3]}kg</span></div>` : ''}
          ${r[17] ? `<div class="day-stat">Gordura <span>${r[17]}%</span></div>` : ''}
        </div>
        ${r[7] ? `<div style="font-size:12px;color:var(--text2);margin-top:6px">🏃 ${r[7]}</div>` : ''}
        <div class="badges-row">
          ${r[12] ? `<span class="badge badge-blue">${String(r[12]).split(',').length} supls</span>` : ''}
        </div>
        ${r[15] ? `<div style="font-size:12px;color:var(--text2);margin-top:6px;font-style:italic">${r[15]}</div>` : ''}`;
      list.appendChild(div);
    });
  } catch(e) {
    list.innerHTML = `<div class="empty-state">Erro ao carregar: ${e.message}</div>`;
  }
}

// ── TOGGLE PESO ──
function toggleNoWeight() {
  const inp = document.getElementById('inp-weight');
  const btn = document.getElementById('btn-no-weight');
  const noWeight = inp.disabled;
  if (noWeight) {
    inp.disabled = false;
    inp.value = '';
    inp.placeholder = '86.0';
    btn.style.borderColor = '';
    btn.style.color = '';
  } else {
    inp.disabled = true;
    inp.value = '';
    inp.placeholder = 'não pesado';
    btn.style.borderColor = 'var(--accent)';
    btn.style.color = 'var(--accent)';
    saveNow('weight', { weight: '' }, btn);
  }
  updateStatusCard();
}
